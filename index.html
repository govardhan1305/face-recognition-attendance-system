<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartFace Attendance</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b1020;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #11182d;
            border-bottom: 1px solid #26304d;
        }

        header h1 {
            font-size: 26px;
        }

        header p {
            color: #aab3cc;
            margin-top: 7px;
        }

        .container {
            width: 95%;
            max-width: 1000px;
            margin: 25px auto;
        }

        .card {
            background: #121a30;
            border: 1px solid #26304d;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .camera-box {
            width: 100%;
            max-width: 650px;
            margin: auto;
            background: black;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid #26304d;
            position: relative;
        }

        video {
            width: 100%;
            display: block;
            background: black;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        button {
            border: none;
            padding: 13px 18px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .start {
            background: #2563eb;
            color: white;
        }

        .scan {
            background: #7c3aed;
            color: white;
        }

        .stop {
            background: #dc2626;
            color: white;
        }

        .attendance {
            background: #059669;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            background: #0b1020;
            border: 1px solid #26304d;
        }

        .success {
            color: #34d399;
        }

        .error {
            color: #f87171;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #34405f;
            background: #0b1020;
            color: white;
            font-size: 15px;
        }

        .register-button {
            background: #2563eb;
            color: white;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #293451;
            text-align: left;
        }

        th {
            color: #aab3cc;
        }

        .status {
            margin-top: 15px;
            color: #aab3cc;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 22px;
            }

            .container {
                width: 92%;
            }

            button {
                flex: 1;
                min-width: 100px;
            }

            th, td {
                font-size: 13px;
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>SmartFace Attendance</h1>
    <p>Real-time AI Face Recognition Attendance System</p>
</header>

<div class="container">

    <!-- CAMERA -->
    <div class="card">

        <h2>📷 Face Recognition</h2>

        <div class="camera-box">
            <video id="video" autoplay playsinline></video>
        </div>

        <canvas id="canvas" style="display:none;"></canvas>

        <div class="buttons">

            <button class="start" onclick="startCamera()">
                ▶ Start Camera
            </button>

            <button class="scan" onclick="scanFace()" id="scanBtn" disabled>
                🔍 Scan Face
            </button>

            <button class="stop" onclick="stopCamera()">
                ⏹ Stop Camera
            </button>

        </div>

        <div id="cameraStatus" class="status">
            Camera is not started.
        </div>

        <div id="result" class="result">
            <strong>Recognition Result</strong>
            <p id="resultText">No face scanned yet.</p>
        </div>

    </div>


    <!-- REGISTER STUDENT -->

    <div class="card">

        <h2>👤 Register Student</h2>

        <input
            type="text"
            id="studentName"
            placeholder="Enter student name"
        >

        <input
            type="text"
            id="studentId"
            placeholder="Enter student ID"
        >

        <button
            class="register-button"
            onclick="registerStudent()">
            Register Face
        </button>

        <p id="registerStatus" class="status"></p>

    </div>


    <!-- ATTENDANCE -->

    <div class="card">

        <h2>📊 Today's Attendance</h2>

        <button
            class="attendance"
            onclick="loadAttendance()">
            🔄 Refresh Attendance
        </button>

        <table>

            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Time</th>
                </tr>
            </thead>

            <tbody id="attendanceTable">

                <tr>
                    <td colspan="3">
                        No attendance loaded.
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

    /*
    ==================================================
    IMPORTANT
    ==================================================

    Replace this with your actual Render Flask URL.

    Example:

    const BACKEND_URL =
    "https://face-recognition-backend.onrender.com";

    ==================================================
    */

    const BACKEND_URL = "YOUR_RENDER_BACKEND_URL";


    let video = document.getElementById("video");
    let canvas = document.getElementById("canvas");

    let stream = null;

    let lastRecognizedStudent = null;


    // ================================================
    // START CAMERA
    // ================================================

    async function startCamera() {

        try {

            stream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });

            video.srcObject = stream;

            document.getElementById("scanBtn").disabled = false;

            document.getElementById("cameraStatus").innerHTML =
                "🟢 Camera is running.";

        }

        catch (error) {

            console.error(error);

            document.getElementById("cameraStatus").innerHTML =
                "❌ Camera access denied or unavailable.";

            alert(
                "Please allow camera permission in your browser."
            );
        }
    }


    // ================================================
    // STOP CAMERA
    // ================================================

    function stopCamera() {

        if (stream) {

            stream.getTracks().forEach(track => {
                track.stop();
            });

            stream = null;

            video.srcObject = null;
        }

        document.getElementById("scanBtn").disabled = true;

        document.getElementById("cameraStatus").innerHTML =
            "Camera stopped.";
    }


    // ================================================
    // SCAN FACE
    // ================================================

    async function scanFace() {

        if (!stream) {

            alert("Start the camera first.");

            return;
        }


        const width = video.videoWidth;
        const height = video.videoHeight;

        canvas.width = width;
        canvas.height = height;


        const context = canvas.getContext("2d");

        context.drawImage(
            video,
            0,
            0,
            width,
            height
        );


        canvas.toBlob(async function(blob) {

            if (!blob) {

                alert("Unable to capture image.");

                return;
            }


            const formData = new FormData();

            formData.append(
                "image",
                blob,
                "face.jpg"
            );


            document.getElementById("resultText").innerHTML =
                "🔍 Recognizing face...";


            try {

                const response = await fetch(
                    BACKEND_URL + "/api/recognize",
                    {
                        method: "POST",
                        body: formData
                    }
                );


                const data = await response.json();

                console.log("Recognition:", data);


                if (data.success) {

                    lastRecognizedStudent = data;


                    let name =
                        data.name ||
                        data.student_name ||
                        "Student";


                    let studentId =
                        data.student_id ||
                        data.id ||
                        "";


                    document.getElementById("resultText").innerHTML =

                        `<span class="success">
                        ✅ Face Recognized
                        <br><br>
                        <strong>Name:</strong> ${name}
                        <br>
                        <strong>Student ID:</strong> ${studentId}
                        </span>`;

                    loadAttendance();

                }

                else {

                    document.getElementById("resultText").innerHTML =

                        `<span class="error">
                        ❌ Face not recognized.
                        </span>`;
                }

            }

            catch (error) {

                console.error(error);

                document.getElementById("resultText").innerHTML =

                    `<span class="error">
                    ❌ Backend connection failed.
                    <br><br>
                    Check your Flask/Render backend.
                    </span>`;
            }

        }, "image/jpeg");

    }


    // ================================================
    // REGISTER STUDENT
    // ================================================

    async function registerStudent() {

        const name =
            document.getElementById("studentName").value.trim();

        const studentId =
            document.getElementById("studentId").value.trim();


        if (!name || !studentId) {

            alert(
                "Enter student name and student ID."
            );

            return;
        }


        if (!stream) {

            alert(
                "Start the camera first."
            );

            return;
        }


        const width = video.videoWidth;
        const height = video.videoHeight;


        canvas.width = width;
        canvas.height = height;


        const context =
            canvas.getContext("2d");


        context.drawImage(
            video,
            0,
            0,
            width,
            height
        );


        canvas.toBlob(async function(blob) {

            const formData =
                new FormData();


            formData.append(
                "name",
                name
            );


            formData.append(
                "student_id",
                studentId
            );


            formData.append(
                "image",
                blob,
                "student.jpg"
            );


            document.getElementById(
                "registerStatus"
            ).innerHTML =
                "Registering face...";


            try {

                const response =
                    await fetch(
                        BACKEND_URL + "/api/register",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "Registration:",
                    data
                );


                if (data.success) {

                    document.getElementById(
                        "registerStatus"
                    ).innerHTML =
                        `<span class="success">
                        ✅ Student registered successfully.
                        </span>`;

                    document.getElementById(
                        "studentName"
                    ).value = "";

                    document.getElementById(
                        "studentId"
                    ).value = "";

                }

                else {

                    document.getElementById(
                        "registerStatus"
                    ).innerHTML =
                        `<span class="error">
                        ❌ ${data.message || "Registration failed."}
                        </span>`;
                }

            }

            catch (error) {

                console.error(error);

                document.getElementById(
                    "registerStatus"
                ).innerHTML =
                    `<span class="error">
                    ❌ Cannot connect to Flask backend.
                    </span>`;
            }

        }, "image/jpeg");

    }


    // ================================================
    // LOAD ATTENDANCE
    // ================================================

    async function loadAttendance() {

        try {

            const response =
                await fetch(
                    BACKEND_URL + "/api/attendance"
                );


            const data =
                await response.json();


            console.log(
                "Attendance:",
                data
            );


            const table =
                document.getElementById(
                    "attendanceTable"
                );


            table.innerHTML = "";


            if (
                !data.success ||
                !data.attendance ||
                data.attendance.length === 0
            ) {

                table.innerHTML =

                    `<tr>
                    <td colspan="3">
                    No attendance records today.
                    </td>
                    </tr>`;

                return;
            }


            data.attendance.forEach(
                record => {

                    const row =
                        document.createElement("tr");


                    row.innerHTML =

                        `<td>
                        ${record.student_id || record.id || ""}
                        </td>

                        <td>
                        ${record.name || ""}
                        </td>

                        <td>
                        ${record.time || record.timestamp || ""}
                        </td>`;


                    table.appendChild(row);

                }
            );

        }

        catch (error) {

            console.error(error);

            document.getElementById(
                "attendanceTable"
            ).innerHTML =

                `<tr>
                <td colspan="3">
                ❌ Backend not connected.
                </td>
                </tr>`;
        }
    }

</script>

</body>
</html>
